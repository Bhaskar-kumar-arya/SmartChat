name: Build SmartChat for macOS

on:
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload .dmg as artifact?'
        required: false
        default: 'true'
        type: boolean

  # Also triggers on pushes to main/master that touch the smartchat source
  push:
    branches: [main, master]
    paths:
      - 'smartchat/**'
      - '.github/workflows/build-mac.yml'

jobs:
  build-mac:
    name: Build macOS .dmg
    runs-on: macos-latest

    defaults:
      run:
        # All commands run inside the smartchat sub-directory
        working-directory: smartchat

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ───────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smartchat/package-lock.json

      # ── 3. Install system deps (libvips for sharp / @xenova/transformers) ──
      # sharp (a dep of @xenova/transformers) links against libvips at compile
      # time. Without this, electron/rebuild fails when it tries to recompile
      # sharp from source on the macOS runner.
      - name: Install libvips via Homebrew
        run: brew install vips

      # ── 4. Install npm dependencies ────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      # ── 5. Rebuild native modules for Electron on macOS ───────────────────
      # Rebuilds better-sqlite3, onnxruntime-node, sqlite-vec, etc. against
      # the Electron 39.8.2 headers. We do NOT set build_from_source globally
      # so that modules with prebuilt binaries (e.g. sharp) can use them.
      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild --force -v 39.8.2
        env:
          npm_config_target: '39.8.2'
          npm_config_runtime: 'electron'
          npm_config_disturl: 'https://electronjs.org/headers'
          # SHARP_IGNORE_GLOBAL_LIBVIPS=false lets sharp find the brew-installed vips
          SHARP_IGNORE_GLOBAL_LIBVIPS: 'false'

      # ── 6. Generate Prisma client ──────────────────────────────────────────
      - name: Generate Prisma client
        run: npx prisma generate

      # ── 7. Write .env (DATABASE_URL only — no secret keys needed to build) ─
      - name: Create .env for build
        run: |
          echo 'DATABASE_URL="file:./prisma/dev.db"' > .env

      # ── 8. Build (electron-vite compile + generate template DB) ───────────
      - name: Build (electron-vite + generate template DB)
        run: npm run build
        env:
          NODE_ENV: production

      # ── 9. Package as macOS .dmg ───────────────────────────────────────────
      - name: Package macOS .dmg (unsigned)
        run: npx electron-builder --mac --publish never
        env:
          # Disable code-signing — unsigned build, notarize is already false
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      # ── 10. Upload .dmg as a GitHub Actions artifact ───────────────────────
      - name: Upload macOS .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartChat-macOS-dmg
          # electron-builder places the output in smartchat/dist/
          path: smartchat/dist/*.dmg
          retention-days: 14
          if-no-files-found: error
