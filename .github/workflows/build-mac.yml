name: Build SmartChat for macOS

on:
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload .dmg as artifact?'
        required: false
        default: 'true'
        type: boolean

  # Also triggers on pushes to main/master that touch the smartchat source
  push:
    branches: [main, master]
    paths:
      - 'smartchat/**'
      - '.github/workflows/build-mac.yml'

jobs:
  build-mac:
    name: Build macOS .dmg
    runs-on: macos-latest

    defaults:
      run:
        # All commands run inside the smartchat sub-directory
        working-directory: smartchat

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ───────────────────────────────────────────────────
      # @electron/rebuild >=4 requires Node >=22.12.0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartchat/package-lock.json

      # ── 3. Drop China npmmirror mirror overrides for CI ───────────────────
      # The repo pins npmmirror mirrors in three places:
      #   .npmrc               → electron_mirror, electron_builder_binaries_mirror
      #   electron-builder.yml → electronDownload.mirror
      # npmmirror serves the Electron runtime fine, but it 404s on the
      # dmg-builder / dmgbuild bundle that electron-builder pulls when it
      # builds the DMG, because app-builder derives that download URL from the
      # Electron mirror base (cdn.npmmirror.com/binaries/electron/...).
      # On GitHub runners the official GitHub release hosts are fast and
      # reliable, so strip every mirror override and fall back to defaults.
      - name: Drop npmmirror mirror overrides for CI
        run: |
          rm -f .npmrc
          sed -i '' -e '/^electronDownload:/d' -e '/mirror: *https:\/\/npmmirror/d' electron-builder.yml
          echo "=== .npmrc ===" && (cat .npmrc 2>/dev/null || echo "(removed)")
          echo "=== electron-builder.yml tail ===" && tail -n 8 electron-builder.yml

      # ── 4. Install npm dependencies ────────────────────────────────────────
      # SHARP_IGNORE_GLOBAL_LIBVIPS=1 forces sharp to use its own prebuilt
      # binary instead of compiling from source against a system libvips.
      # This avoids the "napi.h not found" build failure when no dev headers
      # are available for the system-installed vips.
      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
          npm_config_sharp_ignore_global_libvips: 'true'

      # ── 5. Rebuild native modules for Electron on macOS ───────────────────
      # Rebuilds better-sqlite3, onnxruntime-node, sqlite-vec, etc. against
      # Electron 39.8.2 headers.
      # --ignore sharp  →  sharp lives in @xenova/transformers and only runs
      #   in the main process where Node.js prebuilt binaries work fine.
      #   Forcing a recompile requires system libvips dev headers which are
      #   unavailable on the runner, so we skip it entirely.
      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild --force -v 39.8.2 --ignore sharp
        env:
          npm_config_target: '39.8.2'
          npm_config_runtime: 'electron'
          npm_config_disturl: 'https://electronjs.org/headers'
          SHARP_IGNORE_GLOBAL_LIBVIPS: '1'

      # ── 6. Generate Prisma client ──────────────────────────────────────────
      - name: Generate Prisma client
        run: npx prisma generate

      # ── 7. Write .env (DATABASE_URL only — no secret keys needed to build) ─
      - name: Create .env for build
        run: |
          echo 'DATABASE_URL="file:./prisma/dev.db"' > .env

      # ── 8. Build (electron-vite compile + generate template DB) ───────────
      - name: Build (electron-vite + generate template DB)
        run: npm run build
        env:
          NODE_ENV: production

      # ── 9. Package as macOS .dmg ───────────────────────────────────────────
      - name: Package macOS .dmg (unsigned)
        run: npx electron-builder --mac --publish never
        env:
          # Disable code-signing — unsigned build, notarize is already false
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          # Force the dmg-builder / dmgbuild bundle download to the official
          # GitHub release host instead of the npmmirror base that 404s.
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      # ── 10. Upload .dmg as a GitHub Actions artifact ───────────────────────
      - name: Upload macOS .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartChat-macOS-dmg
          # electron-builder places the output in smartchat/dist/
          path: smartchat/dist/*.dmg
          retention-days: 14
          if-no-files-found: error
