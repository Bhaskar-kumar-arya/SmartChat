<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Message Overlay</title>
  <style>
    :root {
      --wa-bg-secondary: #202c33;
      --wa-bg-main: #111b21;
      --wa-text-primary: #e9edef;
      --wa-text-secondary: #8696a0;
      --wa-divider: #222d34;
      --wa-primary: #00a884;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--wa-bg-main);
      color: var(--wa-text-primary);
      padding: 16px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-bar {
      font-size: 12px;
      color: var(--wa-text-secondary);
      padding-bottom: 4px;
      border-bottom: 1px solid var(--wa-divider);
    }

    textarea {
      flex: 1;
      width: 100%;
      background: var(--wa-bg-secondary);
      color: var(--wa-text-primary);
      border: 1px solid var(--wa-divider);
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
    }

    textarea:focus {
      border-color: var(--wa-primary);
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, filter 0.2s ease;
    }

    .btn-secondary {
      background: transparent;
      color: var(--wa-text-secondary);
    }

    .btn-secondary:hover {
      color: var(--wa-text-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-primary {
      background: var(--wa-primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

  <div class="info-bar" id="target-info">Target Chat: Active Chat</div>

  <textarea id="message-text" placeholder="Type message to send via Webview Overlay..."></textarea>

  <div class="footer">
    <button type="button" class="btn-secondary" id="cancel-btn">Cancel</button>
    <button type="button" class="btn-primary" id="send-btn">Send Message</button>
  </div>

  <script>
    if (window.__smartchat) {
      window.addEventListener('message', (e) => {
        const { channel, args } = e.data || {};
        if (channel === 'smartchat:init') {
          const { tokens, context } = args[0] || {};
          if (tokens && typeof tokens === 'object') {
            const style = document.createElement('style');
            const vars = Object.entries(tokens).map(([k, v]) => `  ${k}: ${v};`).join('\n');
            style.textContent = `:root {\n${vars}\n}`;
            document.head.appendChild(style);
          }
          if (context && context.chatJid) {
            document.getElementById('target-info').textContent = `Target Chat: ${context.chatJid}`;
          }
        }
      });
    }

    document.getElementById('cancel-btn').addEventListener('click', () => {
      if (window.__smartchat && typeof window.__smartchat.dismiss === 'function') {
        window.__smartchat.dismiss();
      }
    });

    document.getElementById('send-btn').addEventListener('click', () => {
      const text = document.getElementById('message-text').value.trim();
      if (!text) return;
      if (window.__smartchat && typeof window.__smartchat.submit === 'function') {
        window.__smartchat.submit({ text });
      }
    });
  </script>
</body>
</html>
